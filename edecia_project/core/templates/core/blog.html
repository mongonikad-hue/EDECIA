{% extends 'core/base.html' %}
{% block title %}Blog - EDECIA{% endblock %}
{% block content %}
<h2>Blog</h2>
<ul class="posts">
    {% for post in posts %}
        <li>
            <h3>{{ post.title }}</h3>
            <p>{{ post.content|truncatechars:200 }}</p>
            <small>{{ post.created_at }}</small>
        </li>
    {% empty %}
        <li>No posts yet.</li>
    {% endfor %}
</ul>
{% endblock %}
